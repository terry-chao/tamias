<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tamias Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1c1f24;
        --line: #3a3c42;
        --text: #d8d4ce;
        --muted: #8b8680;
        --accent: #4c8dff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, sans-serif;
      }
      #root {
        height: 100%;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header strong {
        font-size: 15px;
      }
      header span {
        color: var(--muted);
        font-size: 12px;
      }
      button,
      label.file {
        border: 1px solid var(--line);
        background: #25282e;
        color: var(--text);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover,
      label.file:hover {
        border-color: var(--accent);
      }
      input[type="file"] {
        display: none;
      }
      .stage {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #viewport {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: var(--muted);
        font-size: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="tamias_viewer.js"></script>
    <script type="module">
      import { createElement as h, useEffect, useRef, useState } from "https://esm.sh/react@18";
      import { createRoot } from "https://esm.sh/react-dom@18/client";

      const module = await createTamiasViewer();

      function App() {
        const canvasRef = useRef(null);
        const [status, setStatus] = useState("loading");

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas || !module.startViewer("#viewport")) {
            setStatus(module.status());
            return;
          }
          const syncSize = () => {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            module.resizeViewer(Math.max(2, Math.floor(rect.width * dpr)),
                                Math.max(2, Math.floor(rect.height * dpr)));
          };
          syncSize();
          const loop = () => {
            module.renderFrame();
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
          setStatus(module.status());

          const onResize = () => syncSize();
          window.addEventListener("resize", onResize);
          return () => window.removeEventListener("resize", onResize);
        }, []);

        const onFile = async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          const buf = new Uint8Array(await file.arrayBuffer());
          let binary = "";
          const chunk = 0x8000;
          for (let i = 0; i < buf.length; i += chunk) {
            binary += String.fromCharCode(...buf.subarray(i, i + chunk));
          }
          module.loadFile(file.name, binary);
          setStatus(module.status());
        };

        return h("div", { className: "app" },
          h("header", null,
            h("strong", null, "Tamias Viewer"),
            h("span", null, "引擎 WASM · 阶段 1 查看器"),
            h("label", { className: "file" },
              "打开 .tdoc / .obj",
              h("input", { type: "file", accept: ".tdoc,.obj", onChange: onFile })
            ),
            h("button", { onClick: () => module.frameAll() }, "框选全部"),
            h("span", null, status)
          ),
          h("div", { className: "stage" },
            h("canvas", {
              id: "viewport",
              ref: canvasRef,
              onPointerDown: (e) => {
                e.preventDefault();
                e.currentTarget.setPointerCapture(e.pointerId);
                module.pointerDown(e.clientX, e.clientY, e.button);
              },
              onPointerMove: (e) => module.pointerMove(e.clientX, e.clientY),
              onPointerUp: (e) => module.pointerUp(e.clientX, e.clientY, e.button),
              onPointerCancel: (e) => module.pointerUp(e.clientX, e.clientY, e.button),
              onAuxClick: (e) => e.preventDefault(),
              onWheel: (e) => {
                e.preventDefault();
                module.wheel(e.deltaY);
              },
              onContextMenu: (e) => e.preventDefault(),
            }),
            h("div", { className: "hint" }, "中键旋转 · 右键平移 · 滚轮缩放")
          )
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
