site_name: Tamias
site_description: 跨 MCAD / BIM 的几何查看 + 参数化编辑内核
site_url: https://terry-chao.github.io/tamias/
repo_url: https://github.com/terry-chao/tamias
repo_name: terry-chao/tamias
edit_uri: edit/main/docs/

# 老链接保活：这一页已经拆成 教程 + API 参考，留着只为不 404，
# 不进导航（mkdocs >= 1.5 的 not_in_nav 用来消掉"未收录"警告）。
not_in_nav: |
  plugin/develop.md

theme:
  name: cinder
  custom_dir: overrides
  colorscheme: github
  highlightjs: true
  hljs_languages:
    - yaml
    - cpp
    - csharp
    - cmake
    - bash

extra_css:
  - css/brand.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

# 导航：总览定坐标，再按路线图分层（见 ROADMAP §2）；BIM 夹在客户端与场景图之间
nav:
  - 首页: index.md
  - 总览:
      - 路线图: ROADMAP.md
      - MCAD 与 BIM: DECISION-MCAD-BIM.md
      - 内嵌浏览器（决策）: DECISION-EMBEDDED-BROWSER.md
      - 架构: ARCHITECTURE.md
  - 答疑、测试与性能分析:
      - 答疑（Q&A）: FAQ.md
      - 测试: TESTING.md
      - 性能分析（Tracy）: PROFILING.md
  - 入门教程:
      - tutorial/index.md
      - 1. 认识 Tamias: tutorial/01-what-is-tamias.md
      - 2. 构建与运行: tutorial/02-build-and-run.md
      - 3. 界面与交互: tutorial/03-ui-and-interaction.md
      - 4. 代码骨架: tutorial/04-code-map.md
      - 5. 几何与造型: tutorial/05-geometry-and-modeling.md
      - 6. 文档与场景: tutorial/06-document-and-scene.md
      - 7. 命令与撤销: tutorial/07-commands-and-undo.md
      - 8. 渲染管线: tutorial/08-rendering-pipeline.md
      - 9. BIM 业务层: tutorial/09-bim-layer.md
      - 10. Web 与路线图: tutorial/10-web-and-roadmap.md
      - 术语速查: tutorial/glossary.md
  - 客户端:
      - app/index.md
      - Qt 壳: APP.md
      - 脚本与命令控制台: SCRIPTING.md
      - 参考图纸: DRAWING.md
  - 插件:
      - plugin/index.md
      - 设计理念: plugin/design.md
      - 使用: plugin/usage.md
      - 教程（Tutorial）:
          - plugin/tutorial.md
          - 1. 第一个扩展: plugin/tutorial/01-first-extension.md
          - 2. 读文档: plugin/tutorial/02-read-document.md
          - 3. 改文档: plugin/tutorial/03-edit-and-undo.md
          - 4. 对话框与视口输入: plugin/tutorial/04-dialogs-and-input.md
          - 5. 工程、元数据与发布: plugin/tutorial/05-project-and-ship.md
      - API 参考（API Reference）:
          - plugin/api.md
          - IHost: plugin/api/host.md
          - 文档快照与枚举: plugin/api/document.md
          - 宿主对话框: plugin/api/ui.md
          - 视口输入: plugin/api/input.md
          - 命令与参数: plugin/api/commands.md
          - C ABI: plugin/api/abi.md
  - BIM:
      - bim/index.md
      - BIM 业务层: BIM.md
      - 图纸 → BIM（翻模）: DRAWING-TO-BIM.md
      - 关联关系: bim/relations.md
      - 墙-墙交接: bim/junctions.md
  - 场景图:
      - scene/index.md
      - 语义树: SCENE-GRAPH.md
      - 空间索引（点选 / 框选）: SPATIAL-INDEX.md
  - 造型:
      - modeling/index.md
      - 建模内核（Kernel）: MODELING-KERNEL.md
      - 特征树求值器: FEATURE-TREE-EVALUATOR.md
      - MCAD 管线: MCAD-PIPELINE.md
      - 几何边界: ISHAPE-OPS.md
      - 几何边界入口: kernel/index.md
  - 渲染:
      - render/index.md
      - 超大规模三角: MASSIVE-GEOMETRY.md
      - 管线与 RHI: RENDERING.md
      - RHI 启动（探测/降级/块名单）: RHI-STARTUP.md
      - 视锥、NDC 与屏幕: NDC.md
      - OpenGL 后端: OPENGL.md
      - wgpu 接入: WGPU.md
      - Web 查看器: WEB.md
      - 视锥剔除: FRUSTUM-CULLING.md
      - 合批 / Instancing: INSTANCING.md
      - 场景文字: TEXT.md
      - 渲染场景快照: RENDER-SCENE.md
