site_name: Tamias
site_description: 跨 MCAD / BIM 的几何查看 + 参数化编辑内核
site_url: https://terry-chao.github.io/tamias/
repo_url: https://github.com/terry-chao/tamias
repo_name: terry-chao/tamias
edit_uri: edit/main/docs/

theme:
  name: cinder
  custom_dir: overrides
  colorscheme: github
  highlightjs: true
  hljs_languages:
    - yaml
    - cpp
    - cmake
    - bash

extra_css:
  - css/brand.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

# 导航按路线图分层（见 ROADMAP §2）；BIM 业务夹在客户端与场景图之间
nav:
  - 首页: index.md
  - 总览:
      - overview/index.md
      - 路线图: ROADMAP.md
      - MCAD 与 BIM: DECISION-MCAD-BIM.md
  - 客户端:
      - app/index.md
      - Qt 壳: APP.md
  - BIM 业务:
      - bim/index.md
      - BIM 业务层: BIM.md
  - 场景图:
      - scene/index.md
      - 语义树: SCENE-GRAPH.md
  - 造型:
      - modeling/index.md
      - 特征树求值器: FEATURE-TREE-EVALUATOR.md
      - MCAD 管线: MCAD-PIPELINE.md
  - 渲染:
      - render/index.md
      - 管线与 RHI: RENDERING.md
      - 视锥、NDC 与屏幕: NDC.md
      - OpenGL 后端: OPENGL.md
      - 视锥剔除: FRUSTUM-CULLING.md
  - 几何边界:
      - kernel/index.md
      - IShapeOps 与 OCCT: ISHAPE-OPS.md
