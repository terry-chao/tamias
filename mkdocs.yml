site_name: Tamias
site_description: 跨 MCAD / BIM 的几何查看 + 参数化编辑内核
site_url: https://terry-chao.github.io/tamias/
repo_url: https://github.com/terry-chao/tamias
repo_name: terry-chao/tamias
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

# 导航按路线图五层分（见 ROADMAP §2）
nav:
  - 首页: index.md
  - 总览:
      - overview/index.md
      - 路线图: ROADMAP.md
      - MCAD 与 BIM: DECISION-MCAD-BIM.md
  - 客户端:
      - app/index.md
      - Qt 壳: APP.md
  - 语义场景:
      - scene/index.md
      - 场景图: SCENE-GRAPH.md
  - 造型:
      - modeling/index.md
      - 特征树求值器: FEATURE-TREE-EVALUATOR.md
      - MCAD 管线: MCAD-PIPELINE.md
  - 渲染:
      - render/index.md
      - 管线与 RHI: RENDERING.md
      - OpenGL 后端: OPENGL.md
      - 视锥剔除: FRUSTUM-CULLING.md
  - 几何边界:
      - kernel/index.md
      - IShapeOps 与 OCCT: ISHAPE-OPS.md
