name: readme-stats

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/readme/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate charts
        run: python scripts/readme_stats.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/commits.svg assets/readme/languages.svg
          if git diff --cached --quiet; then
            echo "stats unchanged"
            exit 0
          fi
          git commit -m "chore(readme): 更新提交与语言统计图"
          git push
