<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="1.5 1.5 61 61">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4c5460"/>
      <stop offset="1" stop-color="#2f353d"/>
    </linearGradient>
  </defs>
  <rect x="7" y="11" width="50" height="42" rx="3.5" fill="url(#shell)"
        stroke="#000000" stroke-width="2.38"/>
  <!-- 节点卡：上源、中变换、下输出，右缘出线左缘入线（对齐画布观感） -->
  <g stroke="#000000" stroke-width="1.6">
    <rect x="12" y="16" width="16" height="10" rx="2.2" fill="#4a7dd4"/>
    <rect x="12" y="30" width="16" height="10" rx="2.2" fill="#3f9d6b"/>
    <rect x="36" y="38" width="16" height="10" rx="2.2" fill="#d4884a"/>
  </g>
  <!-- 连线：上卡 → 中卡 → 下卡，水平出入（节点编辑器的贝塞尔连线） -->
  <path d="M28 21 C 34 21, 34 35, 12 33"
        fill="none" stroke="#9ea8b6" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M28 35 C 33 35, 30 43, 36 43"
        fill="none" stroke="#d46a4a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 端口圆点 -->
  <g stroke="#000000" stroke-width="1.1">
    <circle cx="28" cy="21" r="2.2" fill="#9ea8b6"/>
    <circle cx="12" cy="33" r="2.2" fill="#9ea8b6"/>
    <circle cx="28" cy="35" r="2.2" fill="#d46a4a"/>
    <circle cx="36" cy="43" r="2.2" fill="#d46a4a"/>
  </g>
</svg>
